paths:
  module: src/EventOntology.ttl
  bfo: src/bfo-core.ttl
  train: src/train.ttl
  valid: src/valid.ttl
  mowl_metrics: reports/mowl_metrics.json
  definitions_enriched: data/definitions_enriched.csv
  candidates: generated/candidate_el.ttl
  llm_cache_candidates: generated/llm_cache_candidates.json
  embeddings: generated/embeddings.npz
  accepted: generated/accepted_el.ttl
  augmented: src/event-augmented.ttl
  llm_cache_plausibility: generated/llm_cache_plausibility.json
  definitions: data/definitions.csv

split:
  seed: 42
  valid_fraction: 0.20

train:
  seed: 42
  embed_dim: 32
  learning_rate: 0.01
  epochs: 2000
  tau_candidates: [0.60, 0.65, 0.70, 0.75, 0.80]
  target_mean_cos: 0.70

candidates:
  model: claude-opus-5-5
  effort: high
  workers: 8
  # USD per million tokens for the model above (used only to print a cost estimate)
  price_per_mtok: {input: 4.00, output: 20.00, cache_write: 5.00, cache_read: 0.20}
  max_candidates_per_class: 3
  # Labels for CCO properties used in the module but declared in
  # ExtendedRelationOntology (not merged locally). Taken from CCO develop branch.
  cco_property_labels:
    https://www.commoncoreontologies.org/ont00001777: "has process part"
    https://www.commoncoreontologies.org/ont00001803: "is cause of"
    https://www.commoncoreontologies.org/ont00001819: "caused by"
    https://www.commoncoreontologies.org/ont00001936: "is object of"
  # Domain/range of the CCO properties (ExtendedRelationOntology, develop branch).
  # ont00001936's domain is simplified from SDC ∪ GDC ∪ (IC ⊓ ¬spatial region).
  cco_property_domain_range:
    https://www.commoncoreontologies.org/ont00001777:
      domain: [http://purl.obolibrary.org/obo/BFO_0000015]
      range:  [http://purl.obolibrary.org/obo/BFO_0000015]
    https://www.commoncoreontologies.org/ont00001803:
      domain: [http://purl.obolibrary.org/obo/BFO_0000015]
      range:  [http://purl.obolibrary.org/obo/BFO_0000015]
    https://www.commoncoreontologies.org/ont00001819:
      domain: [http://purl.obolibrary.org/obo/BFO_0000003]
      range:  [http://purl.obolibrary.org/obo/BFO_0000003]
    https://www.commoncoreontologies.org/ont00001936:
      domain: [http://purl.obolibrary.org/obo/BFO_0000020, http://purl.obolibrary.org/obo/BFO_0000031, http://purl.obolibrary.org/obo/BFO_0000004]
      range:  [http://purl.obolibrary.org/obo/BFO_0000015]

hybrid:
  w_cos: 0.7
  w_llm: 0.3
  llm_floor: 0.5
  model: claude-opus-5-5
  effort: high
  workers: 8
  price_per_mtok: {input: 4.00, output: 20.00, cache_write: 5.00, cache_read: 0.20}
